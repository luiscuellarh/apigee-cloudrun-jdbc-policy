<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" font-family="'Google Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrRet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f9d58"/>
    </marker>
  </defs>

  <rect width="1000" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="16" width="960" height="42" rx="8" fill="#0f172a"/>
  <text x="40" y="42" fill="#ffffff" font-size="15" font-weight="700">Flow 1: Manage JDBC Connections — Admin Proxy (jdbc-admin-v1) with KVM + Cloud Run TargetEndpoint</text>

  <!-- Lifelines -->
  <g transform="translate(80, 75)">
    <rect x="-55" y="0" width="110" height="36" rx="6" fill="#334155"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Platform Admin</text>
    <line x1="0" y1="36" x2="0" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(290, 75)">
    <rect x="-75" y="0" width="150" height="36" rx="6" fill="#1a73e8"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Apigee: jdbc-admin-v1</text>
    <line x1="0" y1="36" x2="0" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(500, 75)">
    <rect x="-80" y="0" width="160" height="36" rx="6" fill="#d97706"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Encrypted Apigee KVM</text>
    <line x1="0" y1="36" x2="0" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(720, 75)">
    <rect x="-85" y="0" width="170" height="36" rx="6" fill="#0f9d58"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Cloud Run (TargetEndpoint)</text>
    <line x1="0" y1="36" x2="0" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(915, 75)">
    <rect x="-65" y="0" width="130" height="36" rx="6" fill="#7c3aed"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SQL Database</text>
    <line x1="0" y1="36" x2="0" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- Step 1 -->
  <line x1="80" y1="150" x2="284" y2="150" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="90" y="143" fill="#0f172a" font-size="11" font-weight="600">1. POST /v1/jdbc-admin/datasources (datasource_id, driver, dsn, max_conns)</text>

  <!-- Step 2 -->
  <line x1="290" y1="195" x2="494" y2="195" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="300" y="188" fill="#92400e" font-size="11" font-weight="600">2. KVM-Save-Datasource (Key: datasource_id)</text>

  <!-- Step 3 -->
  <line x1="290" y1="245" x2="714" y2="245" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="305" y="238" fill="#075985" font-size="11" font-weight="600">3. TargetEndpoint POST /v1/jdbc/datasources (GoogleIDToken aud: jdbc-policy-service)</text>

  <!-- Step 4 -->
  <line x1="720" y1="295" x2="909" y2="295" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="732" y="288" fill="#4c1d95" font-size="11" font-weight="600">4. sql.Open() + db.PingContext()</text>

  <!-- Step 5 -->
  <line x1="915" y1="335" x2="726" y2="335" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRet)"/>
  <text x="740" y="328" fill="#065f46" font-size="11" font-weight="600">5. Connection Verified &amp; Pool Warmed</text>

  <!-- Step 6 -->
  <line x1="720" y1="385" x2="296" y2="385" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRet)"/>
  <text x="360" y="378" fill="#065f46" font-size="11" font-weight="600">6. 200 OK (status: "registered_and_warmed", masked DSN)</text>

  <!-- Step 7 -->
  <line x1="290" y1="430" x2="86" y2="430" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRet)"/>
  <text x="105" y="423" fill="#065f46" font-size="11" font-weight="600">7. 200 OK JSON Receipt</text>
</svg>
