<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="100%" height="100%" font-family="'Google Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrRet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f9d58"/>
    </marker>
  </defs>

  <rect width="1000" height="510" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="16" width="960" height="42" rx="8" fill="#1e3a8a"/>
  <text x="40" y="42" fill="#ffffff" font-size="14.5" font-weight="700">Step 2: Consume from API Proxy — PropertySet (jdbc.properties) + Single ServiceCallout to Warm Pool</text>

  <!-- Lifelines -->
  <g transform="translate(80, 75)">
    <rect x="-55" y="0" width="110" height="36" rx="6" fill="#1e40af"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">API Consumer</text>
    <line x1="0" y1="36" x2="0" y2="405" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(300, 75)">
    <rect x="-85" y="0" width="170" height="36" rx="6" fill="#1a73e8"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Apigee: jdbc-policy-callout-v1</text>
    <line x1="0" y1="36" x2="0" y2="405" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(560, 75)">
    <rect x="-85" y="0" width="170" height="36" rx="6" fill="#0f9d58"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Cloud Run (Warm Pool)</text>
    <line x1="0" y1="36" x2="0" y2="405" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(775, 75)">
    <rect x="-65" y="0" width="130" height="36" rx="6" fill="#7c3aed"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">SQL Database</text>
    <line x1="0" y1="36" x2="0" y2="405" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>
  <g transform="translate(925, 75)">
    <rect x="-55" y="0" width="110" height="36" rx="6" fill="#334155"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Backend Target</text>
    <line x1="0" y1="36" x2="0" y2="405" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  </g>

  <!-- PropertySet & Persistent Pool Notes -->
  <rect x="195" y="120" width="220" height="30" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="305" y="139" text-anchor="middle" fill="#312e81" font-size="10" font-weight="700">PropertySet: {propertyset.jdbc.datasource_id}</text>

  <rect x="545" y="120" width="245" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-dasharray="4,3"/>
  <text x="667" y="139" text-anchor="middle" fill="#15803d" font-size="10.5" font-weight="700">Persistent Open TCP Sockets (30s Keep-Alive Ping)</text>

  <!-- Step 1 -->
  <line x1="80" y1="175" x2="294" y2="175" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="90" y="168" fill="#0f172a" font-size="11" font-weight="600">1. GET /v1/jdbc-policy/subscribers?id=1001</text>

  <!-- Step 2 -->
  <line x1="300" y1="220" x2="554" y2="220" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="308" y="213" fill="#1e40af" font-size="10.5" font-weight="600">2. SC-JDBC-Policy-Callout (datasource_id: "{propertyset.jdbc.datasource_id}")</text>

  <!-- Step 3 -->
  <line x1="560" y1="265" x2="769" y2="265" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="572" y="258" fill="#4c1d95" font-size="11" font-weight="600">3. Execute Prepared SQL on Already-Open Socket</text>

  <!-- Step 4 -->
  <line x1="775" y1="305" x2="566" y2="305" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRet)"/>
  <text x="580" y="298" fill="#065f46" font-size="11" font-weight="600">4. Rows / Columns / Count (Socket Returned to Pool)</text>

  <!-- Step 5 -->
  <line x1="560" y1="350" x2="306" y2="350" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRet)"/>
  <text x="315" y="343" fill="#065f46" font-size="11" font-weight="600">5. 200 OK (row_count, truncated, first_row, rows[])</text>

  <!-- Step 6 -->
  <line x1="300" y1="395" x2="919" y2="395" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="320" y="388" fill="#0f172a" font-size="11" font-weight="600">6. ExtractVariables (jdbc.*) + Inject X-JDBC-* Headers -&gt; Target</text>

  <!-- Step 7 -->
  <line x1="300" y1="440" x2="86" y2="440" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRet)"/>
  <text x="115" y="433" fill="#065f46" font-size="11" font-weight="600">7. 200 OK Enriched API Response</text>
</svg>
